  <!-- Success Modal -->
  <div id="successModal" class="modal">
    <div class="modal-content">
      <h2>Success!</h2>

      <button id="closeModalButton">OK</button>
    </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script th:src="@{stylesheets/assets/js/codebase.core.min.js}"></script>
  <script th:src="@{stylesheets/assets/js/codebase.app.min.js}"></script>

  <script type="text/javascript">
    $(document).ready(function () {
      // Check if the success parameter exists in the URL
      var success = new URLSearchParams(window.location.search).get('success');

      if (success && success === 'true') {
        // Show the modal
        var modal = $("#successModal");
        var closeButton = $("#closeModalButton");

        modal.show();

        closeButton.click(function () {
          modal.hide();
          var newUrl = window.location.href.split('?')[0]; // Remove query string
          window.history.replaceState(null, null, newUrl); // Update URL without reloading the page
        });

        $(window).click(function (event) {
          if ($(event.target).is(modal)) {
            modal.hide();
            var newUrl = window.location.href.split('?')[0]; // Remove query string
            window.history.replaceState(null, null, newUrl); // Update URL without reloading the page
          }
        });
      }
    });
  </script>
