                                    <th>No.</th>
                                    <th>Food ID</th>
                                    <th>Food Name</th>
                                    <th>Food Quantity</th>
                                    <th>Food Description</th>
                                    <th class="text-center" style="width: 11%;">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white">
                                <tr th:each="food, iterStat : ${foodList}">
                                    <td th:text="${iterStat.index + 1}"></td>
                                    <td th:text="${food.foodid}"></td>
                                    <td th:text="${food.foodname}"></td>
                                    <td th:text="${food.foodquantity}"></td>
                                    <td th:text="${food.fooddescription}"></td>
                                    <td th:text="${food.cafeNumber}" class="hidden"></td>
                                    
                                    <td class="text-center">
                                        <a class="btn btn-sm btn-primary" title="Request" data-toggle="modal"
                                            data-target="#foodDetailModal" th:data-foodid="${food.foodid}"
                                            th:data-foodname="${food.foodname}" th:data-quantity="${food.foodquantity}"
                                            th:data-description="${food.fooddescription}"  th:data-cafeNumber="${food.cafeNumber}" 
                                            onclick="showFoodDetails(this)">
                                            <i class="fa fa-external-link"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                                </button>
                            </div>
                            <div class="modal-body">

                                    <input type="hidden" id="foodidInput" name="foodid">
                                    <input type="hidden" id="cafeNumber" name="cafeNumber">
                                    <!-- Hidden field for food ID -->

                                    <h5 id="foodid"></h5>
                                    <h5 id="modalFoodName"></h5>
                                    <p id="modalFoodDescription"></p>


                                    <!-- Submit button for request -->
                                    <button type="submit" class="btn btn-primary">Submit Request</button>
                                </form>
                            </div>
                        </div>
                    </div>

        <!-- JavaScript to handle modal interactions -->
        <script>
            // Function to show food details in modal
            function showFoodDetails(button) {
                var foodId = $(button).data('foodid');
                var foodName = $(button).data('foodname');
                var foodDescription = $(button).data('description');
                var cafeNumber = $(button).data('cafeNumber');


                console.log("Food ID:", foodId);  // Ensure foodId is correct
                console.log("Food Name:", foodName);

                // Set values in the modal
                $('#foodid').text(foodId);
                $('#modalFoodName').text(foodName);
                $('#modalFoodDescription').text(foodDescription);

                $('#foodidInput').val(foodId);    
                $('#cafeNumber').val(cafeNumber);          // Hidden input field value
                console.log("Hidden input value:", $('#foodidInput').val()); 
                console.log("Hidden input value:", $('#cafeNumber').val());// Verify if value is set
            }
        </script>


        <script>
            function showFoodDetailsS(button) {
                var foodId = button.getAttribute('data-foodid');
                var foodName = button.getAttribute('data-foodname');
                var description = button.getAttribute('data-description');
                var quantity = button.getAttribute('data-quantity');

                // Set values in the modal
                document.getElementById('modalFoodName').innerText = foodName;
                document.getElementById('modalFoodDescription').innerText = description;
                document.getElementById('modalFoodQuantity').innerText = quantity;
                document.getElementById('foodid').innerText = foodId;

                // // Ensure the foodId is set correctly in the hidden input
