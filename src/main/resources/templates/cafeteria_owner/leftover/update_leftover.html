<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">

    <title>Update Leftover - Foodshare</title>

    <meta name="description" content="Update leftover food details">
    <meta name="author" content="Syamimi Afiqah">

    <!-- Open Graph Meta -->
    <meta property="og:title" content="Update Leftover - Foodshare">
    <meta property="og:site_name" content="Foodshare">
    <meta property="og:description" content="Update leftover food details">
    <meta property="og:type" content="website">

    <!-- Icons -->
    <link rel="shortcut icon" th:href="@{stylesheets/assets/media/favicons/favicon.png}">
    <link rel="icon" type="image/png" sizes="192x192" th:href="@{stylesheets/assets/media/favicons/favicon-192x192.png}">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{stylesheets/assets/media/favicons/apple-touch-icon-180x180.png}">

    <!-- stylesheets -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito+Sans:300,400,400i,600,700&display=swap">
    <link rel="stylesheet" id="css-main" th:href="@{stylesheets/assets/css/codebase.min.css}">
    <link rel="stylesheet" id="css-theme" th:href="@{stylesheets/assets/css/themes/flat.min.css}">
</head>

<body>
    <div id="page-container" class="sidebar-o enable-page-overlay side-scroll page-header-modern main-content-boxed">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-content">
                <!-- Side Header -->
                <div class="content-header content-header-fullrow px-15">
                    <div class="content-header-section text-center align-parent sidebar-mini-hidden">
                        <button type="button" class="btn btn-circle btn-dual-secondary d-lg-none align-v-r"
                            data-toggle="layout" data-action="sidebar_close">
                            <i class="fa fa-times text-danger"></i>
                        </button>
                        <div class="content-header-item">
                            <img th:src="@{stylesheets/assets/pictures/Foodshare.png}" style="width: 200px; height:50px;">
                        </div>
                    </div>
                </div>
                <div class="js-sidebar-scroll">
                    <div class="content-side content-side-full">
                        <ul class="nav-main">
                            <li><a class="active" th:href="@{/dashboardCafe}"><i class="si si-cup"></i><span class="sidebar-mini-hide">DASHBOARD</span></a></li>
                            <li><a class="active" th:href="@{/profileCafe_edit}"><i class="si si-user"></i><span class="sidebar-mini-hide">PROFILE</span></a></li>
                            <li><a class="nav-submenu" data-toggle="nav-submenu" href="#"><i class="si si-layers"></i><span class="sidebar-mini-hide">LEFTOVER</span></a>
                                <ul>
                                    <li><a th:href="@{/add_Leftover}">Add Leftover</a></li>
                                    <li><a th:href="@{/foodList}">List Leftover</a></li>
                                    <li>Delete Leftover</li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Container -->
        <main id="main-container">
            <div class="block">
                <div class="block-header block-header-default">
                    <h3 class="block-title">
                        <i class="fa fa-pencil mr-5 text-muted"></i> Update Leftover
                    </h3>
                </div>
                <div class="block-content">
                    <form th:action="@{/updateLeftover}" th:object="${food}" method="POST" enctype="multipart/form-data">
                        <input type="hidden" th:field="*{foodid}" /> <!-- Hidden field for food ID -->
                        <div class="form-group">
                            <label for="foodname">Food Name</label>
                            <input type="text" class="form-control" th:field="*{foodname}" required />
                        </div>
                        <div class="form-group">
                            <label for="foodquantity">Food Quantity</label>
                            <input type="number" class="form-control" th:field="*{foodquantity}" required />
                        </div>
                        <div class="form-group">
                            <label for="fooddescription">Food Pickup</label>
                            <textarea class="form-control" th:field="*{pickupPlace}" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="fooddescription">Food Pickup</label>
                            <textarea class="form-control" th:field="*{pickupTime}" required></textarea>
                        </div>
                        <td>
                            <img th:src="${food.imagePath}" alt="Food Image" style="width: 150px;">
                        </td>
                        <button type="submit" class="btn btn-primary">Update Leftover</button>
                    </form>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer id="page-footer">
            <div class="content py-20 font-size-sm clearfix">
                <div class="float-right">
                    Dibangunkan <i class="fa fa-heart text-pulse"></i> oleh <a class="font-w600"
                        href="https://1.envato.market/ydb" target="_blank">Syamimi Afiqah</a>
                </div>
                <div class="float-left">
                    <a class="font-w600" href="" target="_blank">Foodshare</a> &copy; <span class="js-year-copy"></span>
                </div>
            </div>
        </footer>
    </div>

    <script th:src="@{stylesheets/assets/js/codebase.core.min.js}"></script>
    <script th:src="@{stylesheets/assets/js/codebase.app.min.js}"></script>
    <script th:src="@{stylesheets/assets/js/plugins/jquery-validation/jquery.validate.min.js}"></script>
</body>

</html>
