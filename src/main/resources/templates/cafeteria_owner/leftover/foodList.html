<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Sidebar</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    
    <!-- Codebase CSS (Update the path if needed) -->
    <link rel="stylesheet" th:href="@{stylesheets/assets/css/codebase.min.css}">
</head>
<body>

    <div id="page-container">
        <!-- Sidebar -->
        <nav id="sidebar">
            <!-- Sidebar Content -->
            <div class="sidebar-content">
              <!-- Side Header -->
              <div class="content-header content-header-fullrow px-15">
                <!-- Mini Mode -->
                <div class="content-header-section sidebar-mini-visible-b">
                  <!-- Logo -->
                  <span class="content-header-item font-w700 font-size-xl float-left animated fadeIn">
                    <span class="text-dual-primary-dark">c</span><span class="text-primary">b</span>
                  </span>
                  <!-- END Logo -->
                </div>
                <!-- END Mini Mode -->
      
                <!-- Normal Mode -->
                <div class="content-header-section text-center align-parent sidebar-mini-hidden">
                  <!-- Close Sidebar, Visible only on mobile screens -->
                  <!-- Layout API, functionality initialized in Template._uiApiLayout() -->
                  <button type="button" class="btn btn-circle btn-dual-secondary d-lg-none align-v-r" data-toggle="layout"
                    data-action="sidebar_close">
                    <i class="fa fa-times text-danger"></i>
                  </button>
                  <!-- END Close Sidebar -->
      
                  <!-- Logo -->
                  <div class="content-header-item">
                    <img th:src="@{stylesheets/assets/pictures/Foodshare.png}" style="width: 200px; height:45px;">
                  </div>
                  <!-- END Logo -->
                </div>
                <!-- END Normal Mode -->
              </div>
              <!-- END Side Header -->
      
              <!-- Sidebar Scrolling -->
              <div class="js-sidebar-scroll">
                <!-- Side User -->
                <div class="content-side content-side-full content-side-user px-10 align-parent">
                  <!-- Visible only in mini mode -->
                  <div class="sidebar-mini-visible-b align-v animated fadeIn">
                    <img class="img-avatar img-avatar32" th:src="@{stylesheets/assets/media/avatars/avatar15.jpg}" alt="">
                  </div>
                  <!-- END Visible only in mini mode -->
      
                  <!-- Visible only in normal mode -->
                  <div class="sidebar-mini-hidden-b text-center">
                    <a class="img-link" href="">
                      <img class="img-avatar" th:src="@{stylesheets/assets/media/avatars/avatar15.jpg}" alt="">
                    </a>
                    <ul class="list-inline mt-10">
                      <li class="list-inline-item">
                        <a class="link-effect text-dual-primary-dark font-size-sm font-w600 text-uppercase" href=""><span
                            class="d-none d-sm-inline-block" th:text="${session.cafeName}"></span></a>
                      </li>
                      <li class="list-inline-item">
                        <!-- Layout API, functionality initialized in Template._uiApiLayout() -->
                        <a class="link-effect text-dual-primary-dark" data-toggle="layout"
                          data-action="sidebar_style_inverse_toggle" href="javascript:void(0)">
                          <i class="si si-drop"></i>
                        </a>
                      </li>
                      <li class="list-inline-item">
                        <a class="link-effect text-dual-primary-dark" th:href="@{/logoutcafe}">
                          <i class="si si-logout"></i>
                        </a>
                      </li>
                    </ul>
                  </div>
                  <!-- END Visible only in normal mode -->
                </div>
                <!-- END Side User -->
      
               <!-- Side Navigation -->
      
                          <div class="content-side content-side-full">
                              <ul class="nav-main">
                                  <li><a class="active" th:href="@{/dashboardCafe}"><i class="si si-cup"></i><span
                                        class="sidebar-mini-hide">DASHBOARD</span></a></li>
                                  <li><a class="active" th:href="@{/profileCafe_edit}"><i class="si si-user"></i><span
                                        class="sidebar-mini-hide">PROFILE</span></a>
                                  </li>
                                  <li><a class="nav-submenu" data-toggle="nav-submenu" href="#"><i class="si si-layers"></i><span
                                        class="sidebar-mini-hide">LEFTOVER</span></a>
                                    <ul>
                                      <li><a th:href="@{/add_Leftover}">Add Leftover</a></li>
                                      <li><a th:href="@{/foodList}">List Leftover</a></li>
                                      <li><a th:href="@{/view_request}">Request List</a></li>
                                      <li><a th:href="@{/pickupStatus}">Pickup Status</a></li>
                                    </ul>
                                  </li>
                                  <li><a class="nav-submenu" data-toggle="nav-submenu" href="#"><i class="si si-layers"></i><span
                                        class="sidebar-mini-hide">ORDERS</span></a>
                                    <ul>
                                      <li><a th:href="@{/viewBookings}">Incomming Order</a></li>
                    
                                    </ul>
                                  </li>
                    
                                </ul>
                          </div>
                          <!-- END Side Navigation -->
                      </div>
                      <!-- END Sidebar Scrolling -->
                  </div>
                  <!-- Sidebar Content -->
              </nav>
              <!-- END Sidebar -->
        <!-- Main content -->
        <main id="main-container">
            <div class="content">Main content here</div>
        </main>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    
    <!-- Codebase Core JS (Make sure the path is correct) -->
    <script th:src="@{stylesheets/assets/js/codebase.core.min.js}"></script>

    <!-- Initialize the layout -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (typeof Codebase !== "undefined" && Codebase.layout) {
                Codebase.layout('init');  // Initialize Codebase Layout
            }
        });
    </script>

</body>
</html>
