<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  
    <title>FoodShare </title>
  
    <meta name="description"
      content="Codebase - Bootstrap 4 Admin Template &amp; UI Framework created by pixelcave and published on Themeforest">
    <meta name="author" content="pixelcave">
    <meta name="robots" content="noindex, nofollow">
  
    <!-- Open Graph Meta -->
    <meta property="og:title" content="Codebase - Bootstrap 4 Admin Template &amp; UI Framework">
    <meta property="og:site_name" content="Codebase">
    <meta property="og:description"
      content="Codebase - Bootstrap 4 Admin Template &amp; UI Framework created by pixelcave and published on Themeforest">
    <meta property="og:type" content="website">
    <meta property="og:url" content="">
    <meta property="og:image" content="">
  
    <!-- Icons -->
    <!-- The following icons can be replaced with your own, they are used by desktop and mobile browsers -->
    <link rel="shortcut icon" th:href="@{stylesheets/assets/media/favicons/logo2.jpg}">
    <link rel="icon" type="image/png" sizes="250x250" th:href="@{stylesheets/assets/media/favicons/logo2.jpg}">
    <link rel="apple-touch-icon" sizes="180x180"
      th:href="@{stylesheets/assets/media/favicons/logo2.jpg}">
    <!-- END Icons -->

    <!-- Fonts and Codebase framework -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito+Sans:300,400,400i,600,700&display=swap">
    <link rel="stylesheet" id="css-main" th:href="@{stylesheets/assets/css/codebase.min.css}">
    
        <!-- You can include a specific file from css/themes/ folder to alter the default color theme of the template. eg: -->
    <!-- <link rel="stylesheet" id="css-theme" th:th:href="../assets/css/themes/corporate.min.css"> -->
    <link rel="stylesheet" id="css-theme" th:href="@{stylesheets/assets/css/themes/flat.min.css}"> 
   
  </head>
  <body>
  
    <div id="page-container" class="main-content-boxed">

      <main id="main-container">
        <!-- Page Content -->
        <div class="bg-image" style="background-image: url('stylesheets/assets/pictures/background3.png');">
            <div class="row mx-0 bg-earth-op">
                <div class="hero-static col-md-6 col-xl-8 d-none d-md-flex align-items-md-end">
                    <div class="p-30 invisible" data-toggle="appear">
                        <p class="font-size-h3 font-w600 text-white mb-5">We're very happy you are joining our community!</p>
                        <p class="font-size-h5 text-white">
                            <i class="fa fa-angles-right"></i> Create your account today and receive 50% off.
                        </p>
                        <p class="font-italic text-white-op">Copyright &copy; <span class="js-year-copy"></span></p>
                    </div>
                </div>
                <div class="hero-static col-md-6 col-xl-4 d-flex align-items-center bg-white">
                    <div class="content content-full">
                        <!-- Header -->
                        <div class="px-30 py-10">
                            <img th:src="@{stylesheets/assets/pictures/2.png}" style="width: 200px; height:200px;">
                        </div>
                        <div class="px-30 ">
                            <h1 class="h3 font-w700 mt-10 mt-5 mb-10">Register Account</h1>
                            <h2 class="h5 font-w400 text-muted mb-0">Please enter your details</h2>
                        </div>
                        <!-- END Header -->
    
                        <!-- Sign Up Form -->
                        <form th:action="@{/cafeRegister}" modelAttribute="cafeRegister" th:object="(${cafeRegister})" enctype="multipart/form-data" method="post">
                            <div class="form-group">
                                <label for="signup-ic">Cafe Number</label>
                                <input type="text" class="form-control" id="signup-ic" name="cafeNumber" maxlength="12" pattern="[0-9]*" required>
                            </div>
                            <div class="form-group">
                                <label for="signup-nama">Name</label>
                                <input type="text" class="form-control" id="signup-nama" name="cafeName" oninput="this.value = this.value.toUpperCase()" required>
                            </div>
                            <div class="form-group">
                                <label for="signup-email">Email</label>
                                <input type="email" class="form-control" id="signup-email" name="cafeEmail" required>
                            </div>
                            <div class="form-group">
                              <label for="signup-phone">Phone Number</label>
                              <input type="phone" class="form-control" id="signup-phone" name="cafePhone" required>
                          </div>
                            <div class="form-group">
                                <label for="cafePassword">Password</label>
                                <input type="password" class="form-control" id="cafePassword" name="cafePassword" required>
                            </div>
                            <div class="form-group">
                                <label for="cafePasswordConfirmation">Password Confirmation</label>
                                <input type="password" class="form-control" id="cafePasswordConfirmation" name="cafePasswordConfirmation" required>
                            </div>
                            <div class="form-group">
                                <span id="passwordError" style="color: red; display: none;">Password did not match!</span>
                                <button type="submit" class="btn btn-sm btn-hero btn-alt-success" id="submitBtn">
                                    <i class="si si-login mr-10"></i> Register Account
                                </button>
                                <div class="mt-30">
                                    <a class="link-effect text-muted mr-10 mb-5 d-inline-block" th:href="@{/cafesignin}">
                                        <i class="fa fa-user text-muted mr-5"></i> Login
                                    </a>
                                </div>
                            </div>
                            <script>
                                const passwordInput = document.getElementById('cafePassword');
                                const confirmPasswordInput = document.getElementById('cafePasswordConfirmation');
                                const passwordErrorMessage = document.getElementById('passwordError');
                                const submitButton = document.getElementById('submitBtn');
    
                                confirmPasswordInput.addEventListener('input', validatePasswords);
    
                                function validatePasswords() {
                                    if (passwordInput.value !== confirmPasswordInput.value) {
                                        passwordErrorMessage.style.display = 'inline';
                                        submitButton.disabled = true;
                                    } else {
                                        passwordErrorMessage.style.display = 'none';
                                        submitButton.disabled = false;
                                    }
                                }
                            </script>
                        </form>
                        <!-- END Sign Up Form -->
                    </div>
                </div>
            </div>
            <!-- END Page Content -->
        </div>
    </main>
  </div>
  <!-- END Page Container -->
    

    <!-- Terms Modal -->
    <div class="modal fade" id="modal-terms" tabindex="-1" role="dialog" aria-labelledby="modal-terms" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-slidedown" role="document">
        <div class="modal-content">
          <div class="block block-themed block-transparent mb-0">
            <div class="block-header bg-primary-dark">
              <h3 class="block-title">Terms &amp; Conditions</h3>
              <div class="block-options">
                <button type="button" class="btn-block-option" data-dismiss="modal" aria-label="Close">
                  <i class="si si-close"></i>
                </button>
              </div>
            </div>
            <div class="block-content">
              
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-alt-secondary" data-dismiss="modal">Close</button>
            <button type="button" class="btn btn-alt-success" data-dismiss="modal">
              <i class="fa fa-check"></i> Perfect
            </button>
          </div>
        </div>
      </div>
    </div>
    
    <script th:src="@{stylesheets/assets/js/codebase.core.min.js}"></script>

    <!--
        Codebase JS
    
        Custom functionality including Blocks/Layout API as well as other vital and optional helpers
        webpack is putting everything together at assets/_js/main/app.js
    -->
    <script th:src="@{stylesheets/assets/js/codebase.app.min.js}"></script>
    
    <!-- Page JS Plugins -->
    <script th:src="@{stylesheets/assets/js/plugins/jquery-validation/jquery.validate.min.js}"></script>
    
    <!-- Page JS Code -->
    <script th:src="@{stylesheets/assets/js/pages/op_auth_signin.min.js}"></script>
  </body>
</html>
