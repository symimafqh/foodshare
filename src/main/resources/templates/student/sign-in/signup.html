<body>

  <div id="page-container" class="main-content-boxed">

    <!-- Main Container -->
    <main id="main-container">
      <!-- Page Content -->
      <div class="bg-image" style="background-image: url('stylesheets/assets/pictures/background2.png');">
        <div class="row mx-0 bg-earth-op">
          <div class="hero-static col-md-6 col-xl-8 d-none d-md-flex align-items-md-end">
            <div class="p-30 invisible" data-toggle="appear">
              <p class="font-size-h3 font-w600 text-white mb-5">

              </p>
              <p class="font-size-h5 text-white">
                <i class="fa fa-angles-right"></i>
              </p>
              <p class="font-italic text-white-op">
                Copyright &copy; <span class="js-year-copy"></span>
              </p>
            </div>
          </div>
          <div class="hero-static col-md-6 col-xl-4 d-flex align-items-center bg-white">
            <div class="content content-full">
              <!-- Header -->
              <div class="px-30 py-10 ml-30">
                <!-- <a class="link-effect font-w700" th:th:href=""> -->
                <img th:src="@{stylesheets/assets/pictures/2.png}" style="width: 200px; height:200px;">
                <!-- <i class="si si-fire"></i>
                    <span class="font-size-xl text-primary-dark">code</span><span class="font-size-xl">base</span> -->
                <!-- </a> -->
              </div>
              <div class="px-30 ">
                <h1 class="h3 font-w700 mt-10 mt-5 mb-10">Register Account</h1>
                <h2 class="h5 font-w400 text-muted mb-0">Please fill in this form</h2>
              </div>
              <!-- END Header -->

              <!-- Sign Up Form -->
              <!-- jQuery Validation functionality is initialized with .js-validation-signup class in js/pages/op_auth_signup.min.js which was auto compiled from _js/pages/op_auth_signup.js -->
              <!-- For more examples you can check out https://github.com/jzaefferer/jquery-validation -->
             

              <form th:action="@{/signup}" modelAttribute="signup" th:object="(${signup})" enctype="multipart/form-data"
                method="post">
                <div class="form-group row">
                  <div class="col-12">
                    <div class="form-material">
                      <input type="text" class="form-control" id="signup-number" name="studentNumber" maxlength="12"
                        pattern="[0-9]*" required>
                      <label for="signup-username">Student Number</label>
                      <!-- <small style="color:red;">tanpa (-) atau space(' '). cth:010203054477</small> -->
                    </div>
                  </div>
                </div>
                <div class="form-group row">
                  <div class="col-12">
                    <div class="form-material">
                      <input type="text" class="form-control" id="signup-nama" name="studentName"
                        oninput="this.value = this.value.toUpperCase()" required>
                      <label for="signup-nama">Name</label>
                    </div>
                  </div>
                </div>

                <div class="form-group row">
                  <div class="col-12">
                    <div class="form-material">
                      <input type="text" class="form-control" id="signup-number" name="studentPhone" required>
                      <label for="signup-email">Phone Number</label>
                    </div>
                  </div>
                </div>
                <div class="form-group row">
                  <div class="col-12">
                    <div class="form-material">
                      <input type="email" class="form-control" id="signup-email" name="studentEmail" required>
                      <label for="signup-email">Email</label>
                    </div>
                  </div>
                </div>
                <div class="form-group row">
                  <div class="col-12">
                    <div class="form-material">
                      <input type="password" class="form-control" id="studentPassword" name="studentPassword" required>
                      <label for="signup-password">Password</label>
                    </div>
                  </div>
                </div>
                <div class="form-group row">
                  <div class="col-12">
                    <div class="form-material">
                      <input type="password" class="form-control" id="studentPasswordConfirmation"
                        name="studentPasswordConfirmation" required>
                      <label for="signup-password-confirm">Confirmation Pasword</label>
                    </div>
                  </div>
                </div>
                

                <div class="form-group">
                  <span id="passwordError" style="color: red; display: none;">Password did not match!</span>
                  <button type="submit" class="btn btn-sm btn-hero btn-alt-success" id="submitBtn">
                    <i class="si si-login mr-10"></i> Register Account
                  </button>
                  <div class="mt-30">
                    <a class="link-effect text-muted mr-10 mb-5 d-inline-block" th:href="@{/signin}">
                      <i class="fa fa-user text-muted mr-5"></i> Login
                    </a>
                  </div>
                </div>
                <script>
                  const passwordInput = document.getElementById('studentPassword');
                  const confirmPasswordInput = document.getElementById('studentPasswordConfirmation');
                  const passwordErrorMessage = document.getElementById('passwordError');
                  const submitButton = document.getElementById('submitBtn');

                  confirmPasswordInput.addEventListener('input', validatePasswords);

                  function validatePasswords() {
                    if (passwordInput.value !== confirmPasswordInput.value) {
                      passwordErrorMessage.style.display = 'inline';
                      submitButton.disabled = true;
                    } else {
                      passwordErrorMessage.style.display = 'none';
                      submitButton.disabled = false;
                    }
                  }
                </script>
                <!-- <script>
                  const form = document.querySelector('form'); // Assuming this is your form element
                  const checkbox = document.getElementById('interactedWithBot');
              
                  form.addEventListener('submit', function(event) {
                      if (!checkbox.checked) {
                          alert('You must interact with the FoodShare Bot before registering!');
                          event.preventDefault(); // Prevent form submission
                      }
                  });
              </script> -->
                <script>
                  document.getElementById('openBotBtn').addEventListener('click', function () {
                    // Replace with your actual webhook URL
                    fetch('/webhook', {
                      method: 'POST',
                      headers: {
                        'Content-Type': 'application/json'
                      },
                      body: JSON.stringify({ /* Add necessary data if needed */ })
                    })
                      .then(response => {
                        if (response.ok) {
                          // Open the Telegram bot in a new tab after successfully capturing the session ID
                          window.open('https://t.me/foodshare_bot', '_blank');
                        } else {
                          alert('Failed to capture chat ID. Please try again.');
                        }
                      })
                      .catch(error => {
                        console.error('Error:', error);
                      });
                  });
                </script>


              </form>
              <!-- END Sign Up Form -->
            </div>
          </div>
        </div>
      </div>
      <!-- END Page Content -->
    </main>
    <!-- END Main Container -->
  </div>
  <!-- END Page Container -->




  <script th:src="@{stylesheets/assets/js/codebase.core.min.js}"></script>

  <!-- Page JS Plugins -->

  <!-- Page JS Code -->
