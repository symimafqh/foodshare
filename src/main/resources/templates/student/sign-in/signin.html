<body>

<div id="page-container" class="main-content-boxed">

  <!-- Main Container -->
  <main id="main-container">
    <!-- Page Content -->
    <div class="bg-image" style="background-image: url('stylesheets/assets/pictures/background2.png');">
      <div class="row mx-0 bg-black-op">
        <div class="hero-static col-md-6 col-xl-8 d-none d-md-flex align-items-md-end">
          <div class="p-30 invisible" data-toggle="appear">
            <p class="font-size-h3 font-w600 text-white">
             
            </p>
            <p class="font-italic text-white-op">
              Copyright &copy; <span class="js-year-copy"></span>
            </p>
          </div>
        </div>
        <div class="hero-static col-md-6 col-xl-4 d-flex align-items-center bg-white invisible" data-toggle="appear" data-class="animated fadeInRight">
          <div class="content content-full">
            <!-- Header -->
            <div class="px-30 py-10 ml-30">
              <!-- <a class="link-effect font-w700" href=""> -->
                <img th:src="@{stylesheets/assets/pictures/2.png}" style="width: 200px; height:200px;">
                <!-- <i class="si si-fire"></i>
                <span class="font-size-xl text-primary-dark">code</span><span class="font-size-xl">base</span> -->
              <!-- </a> -->
            </div>
            <div class="px-30 ">
            <h1 class="h3 font-w700 mt-10 mt-5 mb-10">Login Student</h1>
            <h2 class="h5 font-w400 text-muted mb-0">Please login</h2>
          </div>
            <!-- END Header -->

            <!-- Sign In Form -->
            <!-- jQuery Validation functionality is initialized with .js-validation-signin class in js/pages/op_auth_signin.min.js which was auto compiled from _js/pages/op_auth_signin.js -->
            <!-- For more examples you can check out https://github.com/jzaefferer/jquery-validation -->
            <form class="js-validation-signin px-30" method="post" th:action="@{/signin}" modelAttribute="signin" th:object="(${signin})" >
              <div class="form-group row">
                <div class="col-12">
                  <div class="form-material floating">
                    <input type="text" class="form-control" id="studentNumber" name="studentNumber">
                    <label for="login-username">Student Number</label>
                  </div>
                </div>
              </div>
              <div class="form-group row">
                <div class="col-12">
                  <div class="form-material floating">
                    <input type="password" class="form-control" id="studentPassword" name="studentPassword">
                    <label for="login-password">Password</label>
                  </div>
                </div>
              </div>
              <div class="form-group row">
                <div class="col-12">
                  <!--<div class="custom-control custom-checkbox">
                    <input type="checkbox" class="custom-control-input" id="login-remember-me" name="login-remember-me">
                    <label class="custom-control-label" for="login-remember-me">Ingat Saya</label>
                  </div>-->
                </div>
              </div>
             <!-- <div class="form-group">
                <a class="btn btn-sm btn-hero btn-alt-primary" th:href="@{/dashboardStudent}" target="_blank">
                  <i class="si si-login mr-10"></i> Log Masuk
                </a>-->
                <button type="submit" class="btn btn-sm btn-hero btn-alt-primary" >
                  <i class="si si-login mr-10"></i> Login
                </button>
                <div class="mt-30">
                  <a class="link-effect text-muted mr-10 mb-5 d-inline-block" th:href="@{/signupshow}">
                    <i class="fa fa-plus mr-5"></i> Register Account
                  </a>
                  <!--<a class="link-effect text-muted mr-10 mb-5 d-inline-block" th:href="@{/reminder}">
                    <i class="fa fa-warning mr-5"></i> Lupa Kata Laluan
                  </a>-->
                </div>
              </div>
            </form>
            <!-- END Sign In Form -->
          </div>
        </div>

    </div>
    <!-- END Page Content -->

  <!-- END Main Container -->
</div>

<script th:src="@{stylesheets/assets/js/codebase.core.min.js}"></script>

<!--

    Custom functionality including Blocks/Layout API as well as other vital and optional helpers

<!-- Page JS Plugins -->

<!-- Page JS Code -->
<script th:src="@{stylesheets/assets/js/pages/op_auth_signin.min.js}"></script>
